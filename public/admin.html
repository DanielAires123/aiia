<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do mentor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap wide">
  <h1>Painel do mentor</h1>
  <p class="sub" id="who">Respostas e perfis do teu grupo.</p>

  <section id="login" class="card" style="max-width:560px">
    <label>Grupo</label>
    <div class="gpills" id="gpick" role="radiogroup" aria-label="Grupo"></div>
    <label for="pw">Palavra-passe do grupo</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="actions"><span></span><button id="enter" class="primary">Entrar</button></div>
    <div id="loginErr" class="err" role="alert"></div>
  </section>

  <section id="panel" class="hidden">
    <div class="gpills hidden" id="filter" role="radiogroup" aria-label="Filtrar por grupo"></div>
    <div class="stat" id="stats"></div>
    <div class="row" style="margin-bottom:12px">
      <button id="refresh">Atualizar</button>
      <button id="csv">Exportar CSV</button>
      <button id="logout">Sair</button>
    </div>
    <div class="grid">
      <div class="card" style="overflow-x:auto">
        <table>
          <thead><tr><th>Pessoa</th><th>Área</th><th>Estado</th><th>IA</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="missing" class="small" style="margin-top:12px"></div>
      </div>
      <div class="card" id="detail"><p class="small">Seleciona uma pessoa.</p></div>
    </div>
  </section>
</main>
<script src="/admin.js"></script>
</body>
</html>
